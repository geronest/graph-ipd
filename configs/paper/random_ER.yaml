# [paper] Section 4(a): IPD with random matching on Erdos-Renyi graphs.
# 100 graphs with wiring probability p_ER ~ U[0.1, 1], 100,000 interaction
# rounds each, l = 1, no opponent identity.
# Produces the data behind Figures 3, 4, 5 and the ER row of Figure 9.

num_steps: 100000        # [paper] 100,000 interaction rounds
repeat_experiment: 100   # [paper] 100 generated graphs per type
select_partner: False    # [paper] opponent assigned at random from neighbours

state:
  len_history: 1
  agent_id: "none"

agentnet:
  name: "ER"
  p_min: 0.1             # [paper] p_ER ~ U[0.1, 1]
  p_max: 1.0
  no_isolate: True
  netsave_step: 10000
