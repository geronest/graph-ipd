# [paper] Section 4(a): IPD with random matching on Barabasi-Albert graphs.
# m edges added per preferential attachment, m in {1, 2, 3, 4}; 100 graphs,
# 100,000 interaction rounds each, l = 1, no opponent identity.
# Produces the data behind Figures 3, 4, 5 and the BA row of Figure 9.

num_steps: 100000
repeat_experiment: 100
select_partner: False

state:
  len_history: 1
  agent_id: "none"

agentnet:
  name: "BA"
  m_min: 1                 # [paper] m in {1, 2, 3, 4}
  m_max: 5                 # exclusive upper bound: m = m_min + int(rand * (m_max - m_min))
  netsave_step: 10000
